<!DOCTYPE html><html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASI BUKUH — Preorder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#16a34a',
              dark: '#15803d',
              light: '#f0fdf4'
            }
          }
        }
      }
    }
  </script>
</head><body class="bg-gray-50 text-gray-800 antialiased pb-28"><header class="bg-white border-b border-gray-200 sticky top-0 z-30">
  <div class="max-w-md mx-auto px-4 py-3 flex items-center space-x-3">
    <div class="w-10 h-10 bg-brand text-white font-bold text-xl flex items-center justify-center rounded-full">
      NB
    </div>
    <div>
      <h1 class="text-xl font-extrabold tracking-tight text-brand">NASI BUKUH</h1>
      <p class="text-xs font-medium text-gray-500">"Make sebukuh, esok nok lagi 😋"</p>
    </div>
  </div>
</header><main class="max-w-md mx-auto px-4 pt-4">  <div id="view-menu" class="space-y-4">
    <h2 class="text-sm font-bold tracking-wider text-gray-400 uppercase">
      Pilihan Menu
    </h2><div id="menu-container" class="space-y-3"></div>

  </div>  <div id="view-checkout" class="hidden space-y-5"><button onclick="switchView('menu')" class="text-brand font-bold text-sm">
  ← Tambah Menu
</button>

<div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-4">

  <h2 class="text-base font-bold text-gray-900 border-b pb-2">
    Maklumat Delivery
  </h2>

  <div>
    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">
      Nama
    </label>
    <input id="input-nama" type="text"
      placeholder="Contoh: Ali Rahman"
      class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm">
  </div>

  <div>
    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">
      No. WhatsApp
    </label>
    <input id="input-wa" type="tel"
      placeholder="Contoh: 0123456789"
      class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm">
  </div>

  <div>
    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">
      Tarikh Order
    </label>
    <input id="input-tarikh" type="date"
      class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm">
  </div>

  <div>
    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">
      Kawasan Penghantaran
    </label>

    <select id="select-kawasan" onchange="renderSummary()"
      class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm">

      <option value="">-- Pilih Kawasan --</option>
      <option value="Kuala Selangor" data-caj="3">
        Kuala Selangor — RM3.00
      </option>
      <option value="Ijok" data-caj="5">
        Ijok — RM5.00
      </option>
      <option value="Bestari Jaya" data-caj="7">
        Bestari Jaya — RM7.00
      </option>

    </select>
  </div>

  <div>
    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">
      Lokasi Penghantaran
    </label>

    <textarea id="input-lokasi" rows="3"
      placeholder="Alamat lengkap rumah / pejabat..."
      class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm"></textarea>
  </div>

</div>

<div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">

  <h2 class="text-base font-bold text-gray-900 border-b pb-2 mb-3">
    Ringkasan Pesanan
  </h2>

  <div id="checkout-items-list"
    class="space-y-1 text-sm border-b pb-2 mb-2 text-gray-600">
  </div>

  <div class="flex justify-between text-sm">
    <span>Subtotal Makanan</span>
    <span id="summary-subtotal">RM 0.00</span>
  </div>

  <div class="flex justify-between text-sm">
    <span>Caj Delivery</span>
    <span id="summary-delivery">RM 0.00</span>
  </div>

  <div class="flex justify-between text-base font-extrabold pt-2 border-t mt-2">
    <span>JUMLAH BAYARAN</span>
    <span id="summary-total" class="text-brand">RM 0.00</span>
  </div>

</div>

  </div></main><div id="sticky-cart"
  class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 z-40">  <div class="max-w-md mx-auto"><button id="btn-cart-action"
  onclick="handleCartAction()"
  class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-between">

  <span id="cart-btn-info">🛒 0 ITEM • RM 0.00</span>

  <span id="cart-btn-label">
    CHECKOUT →
  </span>

</button>

  </div>
</div><script>

const WORKER_URL =
"https://nasi-bukuh-order.sales-tularisbro.workers.dev/";

const NO_WHATSAPP_PENJUAL =
"601156859808";
const API_URL =
"https://script.google.com/macros/s/AKfycbx-XC-hXqnmJB9V9lfop36ryuf3pUPuSxW0hNG-Vt-dKvxeCw90GEP-1zgm_HKMgwzfA/exec";  

const MENU = [

  {
    id: "ayam",
    nama: "Ayam Goreng Cincang",
    harga: 8
  },

  {
    id: "gulai_ayam",
    nama: "Gulai Ayam",
    harga: 8
  },

  {
    id: "tongkol",
    nama: "Gulai Ikan Tongkol",
    harga: 8
  }

];

let cart = {};

let currentView = "menu";


window.addEventListener("DOMContentLoaded", function() {

  const tomorrow = new Date();

  tomorrow.setDate(tomorrow.getDate() + 1);

  document.getElementById("input-tarikh").value =
    tomorrow.toISOString().split("T")[0];

  renderMenu();

  renderSummary();

});


function renderMenu() {

  const container =
    document.getElementById("menu-container");

  container.innerHTML = MENU.map(item => `

    <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center">

      <div class="flex-1">

        <h3 class="font-bold text-gray-900 text-sm">
          ${item.nama}
        </h3>

        <p class="text-brand font-extrabold text-sm mt-1">
          RM ${item.harga.toFixed(2)}
        </p>

      </div>

      <div class="flex items-center space-x-2 bg-gray-50 p-1 rounded-lg border">

        <button
          onclick="updateCart('${item.id}', -1)"
          class="w-8 h-8 bg-white text-gray-700 font-bold rounded border">
          -
        </button>

        <span
          id="qty-${item.id}"
          class="text-sm font-bold w-5 text-center">
          0
        </span>

        <button
          onclick="updateCart('${item.id}', 1)"
          class="w-8 h-8 bg-brand text-white font-bold rounded">
          +
        </button>

      </div>

    </div>

  `).join("");

}


function updateCart(id, change) {

  const current =
    cart[id] || 0;

  const newQty =
    Math.max(0, current + change);

  if (newQty === 0) {

    delete cart[id];

  } else {

    cart[id] = newQty;

  }

  document.getElementById(
    "qty-" + id
  ).innerText = newQty;

  renderSummary();

}


function getTotals() {

  let count = 0;

  let subtotal = 0;

  Object.entries(cart).forEach(([id, qty]) => {

    const item =
      MENU.find(m => m.id === id);

    if (item) {

      count += qty;

      subtotal +=
        item.harga * qty;

    }

  });


  const select =
    document.getElementById("select-kawasan");

  const selected =
    select.options[select.selectedIndex];

  const deliveryFee =
    selected && selected.dataset.caj
      ? Number(selected.dataset.caj)
      : 0;


  return {

    count,

    subtotal,

    deliveryFee,

    total:
      subtotal + deliveryFee

  };

}


function renderSummary() {

  const totals =
    getTotals();


  document.getElementById(
    "cart-btn-info"
  ).innerText =
    currentView === "menu"
      ? `🛒 ${totals.count} ITEM • RM ${totals.subtotal.toFixed(2)}`
      : `JUMLAH: RM ${totals.total.toFixed(2)}`;


  document.getElementById(
    "cart-btn-label"
  ).innerText =
    currentView === "menu"
      ? "CHECKOUT →"
      : "ORDER VIA WHATSAPP";


  document.getElementById(
    "summary-subtotal"
  ).innerText =
    `RM ${totals.subtotal.toFixed(2)}`;


  document.getElementById(
    "summary-delivery"
  ).innerText =
    `RM ${totals.deliveryFee.toFixed(2)}`;


  document.getElementById(
    "summary-total"
  ).innerText =
    `RM ${totals.total.toFixed(2)}`;


  const list =
    document.getElementById(
      "checkout-items-list"
    );


  list.innerHTML =
    Object.entries(cart).map(([id, qty]) => {

      const item =
        MENU.find(m => m.id === id);

      return `

        <div class="flex justify-between">

          <span>
            ${qty}x ${item.nama}
          </span>

          <span>
            RM ${(item.harga * qty).toFixed(2)}
          </span>

        </div>

      `;

    }).join("");

}


function switchView(view) {

  currentView =
    view;

  document.getElementById(
    "view-menu"
  ).classList.toggle(
    "hidden",
    view !== "menu"
  );

  document.getElementById(
    "view-checkout"
  ).classList.toggle(
    "hidden",
    view !== "checkout"
  );

  renderSummary();

  window.scrollTo(0, 0);

}


function handleCartAction() {

  const totals =
    getTotals();

  if (totals.count === 0) {

    alert(
      "Sila pilih sekurang-kurangnya satu menu."
    );

    return;

  }


  if (currentView === "menu") {

    switchView("checkout");

  } else {

    processOrder();

  }

}


async function processOrder() {

  const nama =
    document.getElementById(
      "input-nama"
    ).value.trim();

  const whatsapp =
    document.getElementById(
      "input-wa"
    ).value.trim();

  const tarikh =
    document.getElementById(
      "input-tarikh"
    ).value;

  const kawasanSelect =
    document.getElementById(
      "select-kawasan"
    );

  const kawasan =
    kawasanSelect.value;

  const lokasi =
    document.getElementById(
      "input-lokasi"
    ).value.trim();


  if (
    !nama ||
    !whatsapp ||
    !tarikh ||
    !kawasan ||
    !lokasi
  ) {

    alert(
      "Sila lengkapkan semua maklumat penghantaran."
    );

    return;

  }


  const totals =
    getTotals();


  const orderId =
    "NB-" +
    Math.floor(
      100000 +
      Math.random() * 900000
    );


  const pesananArray = [];

  Object.entries(cart).forEach(
    ([id, qty]) => {

      const item =
        MENU.find(
          m => m.id === id
        );

      pesananArray.push(
        `${qty}x ${item.nama}`
      );

    }
  );


  const pesanan =
    pesananArray.join(", ");


  const orderData = {

    orderId,

    nama,

    whatsapp,

    kawasan,

    lokasi,

    tarikh,

    pesanan,

    jumlah:
      `RM ${totals.total.toFixed(2)}`

  };


  try {

    await fetch(
      WORKER_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(orderData)

      }
    );

  } catch (error) {

    console.log(
      "Simpanan order:",
      error
    );

  }


  let msg =
    `*ORDER NASI BUKUH*\n`;

  msg +=
    `---------------------------\n`;

  msg +=
    `*Order ID:* ${orderId}\n`;

  msg +=
    `*Nama:* ${nama}\n`;

  msg +=
    `*No. WhatsApp:* ${whatsapp}\n`;

  msg +=
    `*Tarikh Order:* ${tarikh}\n`;

  msg +=
    `*Kawasan:* ${kawasan}\n`;

  msg +=
    `*Lokasi:* ${lokasi}\n\n`;

  msg +=
    `*PESANAN:*\n`;

  pesananArray.forEach(
    item => {

      msg +=
        `- ${item}\n`;

    }
  );

  msg +=
    `\n*Subtotal:* RM ${totals.subtotal.toFixed(2)}\n`;

  msg +=
    `*Caj Delivery:* RM ${totals.deliveryFee.toFixed(2)}\n`;

  msg +=
    `*JUMLAH:* RM ${totals.total.toFixed(2)}\n`;

  msg +=
    `---------------------------\n`;

  msg +=
    `_Bayaran akan diuruskan secara manual melalui WhatsApp._`;


  const waUrl =
    `https://wa.me/${NO_WHATSAPP_PENJUAL}?text=${encodeURIComponent(msg)}`;


  window.location.href =
    waUrl;

}

</script></body>
</html>
